<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    width: 320px;
    padding: 14px;
    color: #1f1f1f;
  }
  h3 { margin: 0 0 10px 0; font-size: 15px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  #start { background: #1a73e8; color: white; }
  #stop { background: #d93025; color: white; }
  #copy, #download { background: #f1f3f4; color: #1f1f1f; }
  #status { margin: 10px 0; font-size: 12.5px; color: #5f6368; min-height: 32px; }
  textarea {
    width: 100%;
    height: 150px;
    box-sizing: border-box;
    font-size: 12px;
    padding: 6px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    resize: vertical;
  }
</style>
</head>
<body>
  <h3>Meet → Local Whisper</h3>
  <div class="row">
    <button id="start">Начать запись</button>
    <button id="stop" disabled>Стоп</button>
  </div>
  <div id="status">Откройте вкладку Google Meet и нажмите «Начать запись».</div>
  <textarea id="transcript" placeholder="Расшифровка появится здесь после остановки..." readonly></textarea>
  <div class="row">
    <button id="copy">Копировать</button>
    <button id="download">Скачать .txt</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

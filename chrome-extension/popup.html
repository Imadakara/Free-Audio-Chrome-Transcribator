<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    width: 320px;
    padding: 14px;
    color: #1f1f1f;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  h3 { margin: 0; font-size: 15px; }
  #version { font-size: 10.5px; color: #80868b; white-space: nowrap; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  #start { background: #1a73e8; color: white; }
  #stop { background: #d93025; color: white; }
  #copy, #download { background: #f1f3f4; color: #1f1f1f; }
  #tab-info { margin-top: 8px; font-size: 11.5px; color: #80868b; }
  .mic-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 12.5px;
    color: #3c4043;
    user-select: none;
  }
  .mic-toggle input { margin: 0; cursor: pointer; }
  .mic-toggle.disabled { opacity: 0.55; }
  #status { margin: 10px 0; font-size: 12.5px; color: #5f6368; min-height: 32px; }
  textarea {
    width: 100%;
    height: 150px;
    box-sizing: border-box;
    font-size: 12px;
    padding: 6px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    resize: vertical;
  }
  textarea.error {
    color: #d93025;
    border-color: #d93025;
    background: #fdeded;
  }
  #author {
    margin-top: 10px;
    text-align: right;
    font-size: 10.5px;
  }
  #author a { color: #80868b; text-decoration: none; }
  #author a:hover { color: #1a73e8; text-decoration: underline; }
</style>
</head>
<body>
  <div class="header">
    <h3>Free Audio Chrome Transcribator</h3>
    <span id="version">v0.1</span>
  </div>
  <div id="tab-info"></div>
  <label class="mic-toggle" id="mic-toggle-label">
    <input type="checkbox" id="mic-toggle" checked>
    Record microphone
  </label>
  <div class="row">
    <button id="start">Start recording</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="status">Open a tab with a video call and click "Start recording".</div>
  <textarea id="transcript" placeholder="The transcript will appear here after you stop recording..." readonly></textarea>
  <div class="row">
    <button id="copy">Copy</button>
    <button id="download">Download .txt</button>
  </div>
  <div id="author">
    <a href="https://github.com/Imadakara/Free-Audio-Chrome-Transcribator" target="_blank" rel="noopener noreferrer">Author</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
